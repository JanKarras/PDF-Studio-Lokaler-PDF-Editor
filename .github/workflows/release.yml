name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/windows-build.yml
    permissions:
      contents: read
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: release-assets
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s release-assets/PDF-Studio-Windows.zip
          test -s release-assets/PDF-Studio-Source.zip
          unzip -t release-assets/PDF-Studio-Windows.zip
          gh release create "$RELEASE_TAG" release-assets/PDF-Studio-Windows.zip release-assets/PDF-Studio-Source.zip --verify-tag --title "PDF Studio $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
